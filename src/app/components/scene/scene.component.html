<section class="story-scene" #scene>
  <img [src]="imageSrc" [class.visible]="imageInView" class="story-image" />
  @if (textHidden) {
    <div class="reveal-text-button" (click)="toggleText()">📜</div>
  }
  @if (!textHidden) {
    <div class="text-card" [ngClass]="{
    'visible': textInView && !onlyImages,
    'hidden': onlyImages
  }">
      <div class="toggle-text-button" (click)="toggleText()">✕</div>
      <span [innerHTML]="formatText(text)"></span>
    </div>
  }
</section>
