<main class="scroll-container">
  @for (scene of scenes; track scene.id; let index = $index){
    <app-scene
      [id]="scene.id"
      [nextSceneId]="getNextSceneId(index)"
      [prevSceneId]="getPrevSceneId(index)"
      [imageSrc]="scene.imageSrc"
      [heading]="scene.heading"
      [text]="scene.text">
    </app-scene>
  }
</main>
<router-outlet></router-outlet>
